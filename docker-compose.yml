services:
  postgres:
    image: postgres:16-alpine
    container_name: brightloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: brightloop_db
      POSTGRES_USER: brightloop_user
      POSTGRES_PASSWORD: brightloop_password
    ports:
      - "5433:5432"
    volumes:
      - brightloop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop_user -d brightloop_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brightloop_postgres_data:
